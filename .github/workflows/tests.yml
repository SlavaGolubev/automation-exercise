name: Run Tests in Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Собираем Docker-образ из Dockerfile
      - name: Build Docker image
        run: docker build -t qa-tests .

      # 3. Запускаем тесты внутри контейнера
      # Пробрасываем папку allure-results, чтобы скачать отчет
      - name: Run tests in Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            qa-tests

      # 4. Загружаем Allure-результаты как артефакт
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30